name: Android Build & Release

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Determine version (from build.gradle.kts versionName)
        id: version
        run: |
          VER=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts | head -1)
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          echo "tag=v$VER" >> "$GITHUB_OUTPUT"
          echo "App version: $VER"

      - name: Decode keystore (only if secret configured)
        if: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > app/release.keystore

      - name: Build APK
        env:
          ANDROID_KEYSTORE_PATH: app/release.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_ALIAS_PASSWORD: ${{ secrets.ANDROID_KEY_ALIAS_PASSWORD }}
        run: |
          if [ -f app/release.keystore ]; then
            echo "Keystore found -> building minified RELEASE APK (small size, ~6MB)"
            ./gradlew assembleRelease
          else
            echo "No keystore secret -> building DEBUG APK (larger size). Add signing secrets to get a minified release (~6MB)."
            ./gradlew assembleDebug
          fi

      - name: Rename APK to huaweitrack.apk
        id: rename
        run: |
          APK=$(find app/build/outputs/apk -name '*.apk' | head -n 1)
          mv "$APK" huaweitrack.apk
          echo "apk_path=$PWD/huaweitrack.apk" >> "$GITHUB_OUTPUT"

      - name: Delete previous release for this version (if any)
        run: gh release delete ${{ steps.version.outputs.tag }} --cleanup-tag --yes || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: HuaweiTrack v${{ steps.version.outputs.version }}
          files: ${{ steps.rename.outputs.apk_path }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
