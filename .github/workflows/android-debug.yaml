name: Android Debug Build

on:
  workflow_dispatch:
  push:
    branches: [master]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Rename APK to huaweitrack.apk
        run: |
          for f in app/build/outputs/apk/debug/*.apk; do
            mv "$f" "app/build/outputs/apk/debug/huaweitrack.apk"
          done

      - name: Delete previous "latest" release (if any)
        run: gh release delete latest --cleanup-tag --yes || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: HuaweiTrack (latest)
          files: app/build/outputs/apk/debug/huaweitrack.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
